# Runs the published images (ghcr.io/argseby/showdown-*). IMAGE_TAG picks a
# release, IMAGE_OWNER only matters for a fork that publishes its own images.
# To build from source instead, add deploy/docker-compose.build.yml
# (make build / make up do that).
services:
  web:
    image: ghcr.io/${IMAGE_OWNER:-argseby}/showdown-web:${IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    image: ghcr.io/${IMAGE_OWNER:-argseby}/showdown-api:${IMAGE_TAG:-latest}
    environment:
      TABLE_RETENTION_DAYS: ${TABLE_RETENTION_DAYS:-90}
      MAX_TABLES: ${MAX_TABLES:-100}
      VOICE_STUN_URLS: ${VOICE_STUN_URLS:-}
      LOG_FORMAT: json
    volumes:
      - data:/data
    expose: ["8080"]            # no `ports:` - never reachable from outside
    healthcheck:
      test: ["CMD", "/showdown", "-healthcheck"]   # binary flag that GETs /readyz; distroless has no curl
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  data:
