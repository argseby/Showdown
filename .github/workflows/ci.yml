name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GO_VERSION: "1.26.2"
  FLUTTER_VERSION: "3.47.2"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: backend
      - name: go test
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: generated files are current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --wasm --release --no-web-resources-cdn

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        run: IMAGE_OWNER=ci docker compose -f docker-compose.yml -f deploy/docker-compose.build.yml build

  # Image publishing: runs only for pushed tags v* and pushes both images to
  # GHCR with the workflow's own token (no extra secrets needed).
  publish:
    runs-on: ubuntu-latest
    needs: [compose]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Image names must be lowercase; the GitHub owner name may not be.
      - name: Lowercase the image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/showdown-api:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_OWNER }}/showdown-api:latest
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-contexts: deploy=deploy
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/showdown-web:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_OWNER }}/showdown-web:latest
