name: showdown
description: Self-hosted Texas Hold'em for private groups.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  flutter: 3.47.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  qr_flutter: ^4.1.0
  shadcn_flutter: ^0.0.54
  shared_preferences: ^2.5.5
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.16.1
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  generate: true
  uses-material-design: false
