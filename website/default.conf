server {
    listen 2244;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml;

    # HTML, CSS and JS change on every deploy: always revalidate.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Images keep their filenames across edits, so a month is plenty.
    location ~* \.(jpe?g|png|webp|avif|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
